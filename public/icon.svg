<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MC-ICP-MS 3D icon</title>
  <desc id="desc">An argon plasma sends ions through a hexapole cell, an electrostatic analyser and a magnet, which fans the beam into several Faraday cups.</desc>
  <defs>
    <linearGradient id="tile" x2="0.8" y2="1">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef5"/>
    </linearGradient>
